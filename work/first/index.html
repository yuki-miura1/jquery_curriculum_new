<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>jQuery</title>
<link rel="stylesheet" href="../../common/css/reset.css">
<link rel="stylesheet" href="../../common/css/base.css">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="wrapper">
  <h1 class="title">jQuery</h1>
  <h2 class="sub-title">Q1</h2>
  <div class="question">
    <div class="btn" id="q1">Q1</div>
  </div>
  <h2 class="sub-title">Q2</h2>
  <div class="question">
    <div class="btn" id="q2">Q2</div>
  </div>
  <h2 class="sub-title">Q3</h2>
  <div class="question">
    <div class="btn" id="q3">Q3</div>
  </div>
  <h2 class="sub-title">Q4</h2>
  <div class="question">
    <div class="btn" id="q4">Q4</div>
  </div>
  <h2 class="sub-title">Q5</h2>
  <div class="question">
    <div class="btn" id="q5">Q5</div>
  </div>
  <h2 class="sub-title">Q6</h2>
  <div class="question">
    <ul class="list" id="q6">
      <li>Q6-1</li>
      <li>Q6-2</li>
      <li>Q6-3</li>
      <li>Q6-4</li>
    </ul>
  </div>
  <h2 class="sub-title">Q7</h2>
  <div class="question">
    <div class="btn" id="q7" data-text="jQuery">Q7</div>
  </div>
</div>
<script src="../../common/js/jquery.js"></script>
<script>
  $(function() {
    // 第1問  id='q1'の要素の文字色を赤色にせよ。
    $('#q1').css('color', 'red');
    //セレクタで指定した要素に対してCSSを適用させている。
    //idをセレクタとして指定するときidの値の先頭#をつける。
    //id=q1の要素がcssメソッドにより文字色が赤色になっている。

    // 第2問  id='q2'の要素をクリックしたら背景色をピンクにせよ。
    $('#q2').click(function() {
      $(this).css('background-color', 'pink');
    });
    //セレクタで指定した要素がクリックされたときその要素の背景色がピンクになっている。
    //クリックされたらイベントが発生する、関数内では対象の要素に対するCSSメソッドが適用。

    // 第3問  id='q3'の要素をクリックしたらこの要素の前後とこの要素内の前後にテキストを挿入せよ。
    $('#q3').click(function() {
      $(this).before('要素前')
             .after('要素の後')
             .prepend('要素内の前')
             .append('要素内の後')
    });
    //セレクタで指定した要素がクリックされたときその要素の兄弟、子要素としてテキストが挿入される。
    //改行とインデントを加え可読性を向上させている。

    // 第4問  id='q4'の要素をクリックしたらこの要素にlargeというクラスを付与せよ。
    $('#q4').click(function() {
      $(this).addClass('large')
    });
    //セレクタで指定した要素がクリックされたとき要素に対してクラスを追加する。
    //cssに「large」クラスが用意されている、クリックのイベントで対象の要素がaddClassメソッドによって追加のクラスが付与されpxを変化させている。

    // 第5問  id='q5'の要素をクリックしたらこの要素を2秒かけてmargin-topとmargin-leftを100pxの位置に移動させよ。
    $('#q5').click(function() {
      $(this).animate({
        'marginLeft': 100,
        'marginTop': 100
      }, 2000);
    });
    //セレクタで指定した要素がクリックされたときその要素を移動させるアニメーションが実行されている。
    //第一引数にcssと値を記述、第二引数に処理にかける時間をミリ秒で記述。
    //2秒かけて左と上の余白を広げ右下に移動したように見せてる。

    // 第6問  id='q6'の子要素をクリックしたら、その要素のインデックス（何番目か）をconsole.log()とalert()を用いて表示させよ。
    $('#q6').find('li').click(function() {
      let targetNum = $(this).index();
      console.log(targetNum);
      alert(targetNum);
    });
    //セレクタで指定した要素のさらにその要素内のli要素がクリックされたときインデックス番号がアラートとして画面に表示されている。
    //クリックイベントで変数targetNumにクリックした要素のインデックス番号が格納されている。
    //この変数はコンソールログ上でも出力され、アラートとしてポップアップで画面上にも表示されている。

    // 第7問  id='q7'の要素をクリックしたらこの要素に設定してあるdata属性をconsoleに表示せよ。
    $('#q7').click(function() {
      let text = $(this).data('text');
      console.log(text);
    });
    //セレクタで指定した要素がクリックされたとき対象要素のdata属性を変数に格納させ、コンソールログに出力させている。

  });
</script>
</body>
</html>
