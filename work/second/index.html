<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <title>jQuery</title>
    <link rel="stylesheet" href="../../common/css/reset.css">
    <link rel="stylesheet" href="../../common/css/base.css">
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <div class="wrapper">
      <p class="modal-show">Click</p>
      <div class="modal" style="display: none;">
        <div class="modal-content">
          <div class="modal-text">MODAL WINDOW</div>
          <button type="button" class="modal-close">x</button>
        </div>
      </div>
    </div>
    <script src="../../common/js/jquery.js"></script>
    <script>
      //セレクタはクラスを指定しクリックのイベントを定義。
      //クラスを指定するときクラス名の先頭に.が必要。
      //.modalに対し.fadeIN()とOut()と書いて()内にミリ秒数を数値で定義し実装。
      //セレクタで指定したクラスをもつ要素がクリックされたときにイベント発生。
      //clickと書かれたボタン押すとdesplay:noneで非表示だったmodalが2秒かけてフェードインして表示。
      //modal内の×押下でmodalが2秒かけてフェードアウトされ非表示へ。
      $(function() {
        $('.modal-show').click(function() {
          $('.modal').fadeIn(2000);
        });

        $('.modal-close').click(function() {
          $('.modal').fadeOut(2000);
        });
      });
      // 今回やるのはモーダルです。
      // .modal-show をクリックすることで .modal をfadeInさせる。
      // .modal-close をクリックで .modal をfadeOutさせる。
      // .click() クリック時のイベントを登録する。
      // .fadeIn() 一定時間かけてフェードインする。
      // .fadeOut() 一定時間かけてフェードアウトする。
    </script>
  </body>
</html>
